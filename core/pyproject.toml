[project]
# PyPI distribution name. The import package is `inline_core` (src/inline_core); PyPI treats the
# hyphen and underscore as equivalent, so `pip install inline-core` installs the `inline_core` package.
name = "inline-core"
version = "1.2.0"
description = "The generation engine behind Inline."
requires-python = ">=3.11"
# Deliberately tiny and torch-free: the engine skeleton must import and serve source nodes on a
# machine with no ML stack at all. Everything heavy is an extra (see `runtime` below), which is what
# lets `server/bootstrap.py` skip model registration best-effort instead of failing to boot.
dependencies = [
  "numpy>=1.26",
  "psutil>=5.9",
]

[project.optional-dependencies]
# THE central model runtime — every model runner shares this one set. Adding a model (Flux, SDXL, …)
# must NOT add another torch/diffusers block here; if a model needs something genuinely specific,
# give it its own small extra that is installed alongside `runtime`, never a second copy of the
# stack. (This replaced the old per-model `zimage` extra, which duplicated torch per model.)
runtime = [
  # NOTE: a bare `torch` resolves to a CPU-only wheel on Windows. `[tool.uv]` below pins the CUDA
  # index for uv; pip users need the --extra-index-url in requirements.txt, and Core warns at
  # startup if it finds an NVIDIA GPU but a CPU-only torch.
  "torch>=2.2",
  # Z-Image landed in diffusers 0.36 (ZImagePipeline); diffusers from git main may be required.
  "diffusers>=0.36",
  "transformers>=4.44",
  "accelerate>=0.30",
  "safetensors>=0.4",
  # Smart memory (`webui.sh --smart-memory`) quantizes the big weights to int8 with torchao's
  # weight-only quant — torch-native and movable, so it coexists with CPU offload. >=0.14 for the
  # config-object API (Int8WeightOnlyConfig; the "int8_weight_only" string form was dropped).
  # Best-effort at load time: an absent/incompatible torchao logs and falls back, never crashes.
  "torchao>=0.14",
  # scipy backs the Beta sigma schedule (FlowMatchEulerDiscreteScheduler.use_beta_sigmas). diffusers
  # gates that option on scipy at scheduler construction; the sampling registry falls back to the
  # model default spacing if it is ever absent, but declare it so Beta works out of the box.
  "scipy>=1.11",
  # Explicit model downloads (the node's model popup) go through huggingface_hub. It ships
  # transitively with diffusers/transformers, but pin it here since we call snapshot_download
  # directly and rely on local_dir= to land files in models/ (never the hidden HF cache).
  "huggingface_hub>=0.23",
]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  # Bundled ffmpeg binary for the Studio timeline render (director preview/export) and audio
  # waveform peaks. ffprobe is not bundled — install a system ffmpeg for duration probing, else
  # clips fall back to a still length.
  "imageio-ffmpeg>=0.4",
]
# Multi-GPU denoise: split one image across GPUs via xDiT (xfuser). Needs `runtime` alongside it
# (torchrun ships with torch); install as `.[runtime,parallel]`. nvidia-ml-py detects NVLink so the
# policy picks Ulysses vs PipeFusion. flash-attn (Ulysses/Ring on NVLink) is an opt-in extra.
parallel = [
  "xfuser>=0.4",
  "nvidia-ml-py>=12",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1",
  "httpx>=0.27",
]
# Convenience aggregate for "give me everything to run locally". Lists concrete packages rather than
# self-referencing `inline-core[...]`, which makes the dependency graph circular to read and trips
# some resolvers/tooling.
all = [
  "torch>=2.2",
  "diffusers>=0.36",
  "transformers>=4.44",
  "accelerate>=0.30",
  "safetensors>=0.4",
  "torchao>=0.14",
  "scipy>=1.11",
  "huggingface_hub>=0.23",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "imageio-ffmpeg>=0.4",
]

# --- torch wheel selection ------------------------------------------------------------------------
# PyTorch publishes CPU-only wheels to PyPI for Windows (Linux wheels bundle CUDA). Without this an
# `uv` install on Windows silently produces CPU-only inference — a working install that is ~100x
# slower, with no error. Pin the CUDA index for Windows so uv resolves a +cu124 build.
# pip users: see requirements.txt for the equivalent --extra-index-url.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]

[project.scripts]
# One command to run the engine + the Inline Studio UI on one port (see main.py for flags).
inline-studio = "inline_core.server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inline_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
