[project]
# PyPI name; the import package is `inline_core` (src/inline_core).
name = "inline-core"
version = "1.2.6"
description = "The generation engine behind Inline Studio."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
# Deliberately torch-free so the engine boots and serves source nodes with no ML stack installed.
dependencies = [
  "numpy>=1.26",
  "psutil>=5.9",
]

[project.optional-dependencies]
# The one shared model runtime. A new model reuses this; it must never add its own torch block.
runtime = [
  # A bare `torch` is CPU-only on Windows; see [tool.uv] below and requirements.txt.
  "torch>=2.2",
  # Krea 2 needs diffusers >= 0.39 (Krea2Pipeline); Z-Image needs >= 0.36 (ZImagePipeline).
  # Pinned, not floored: MiniMax H3 is vendored from an unmerged PR and imports six symbols
  # from the experimental Modular Diffusers surface, which a minor release may rename.
  "diffusers==0.39.0",
  "transformers>=4.44",
  "accelerate>=0.30",
  "safetensors>=0.4",
  # int8 weight-only quant for smart memory; best-effort at load, falls back if absent.
  "torchao>=0.14",
  # Backs the Beta sigma schedule (diffusers gates use_beta_sigmas on scipy).
  "scipy>=1.11",
  # We call snapshot_download directly for the model popup, so pin it rather than rely on transit.
  "huggingface_hub>=0.23",
  # ControlNet preprocessors (the Apply ControlNet node): OpenPose/DWPose, MiDaS/Zoe depth, canny,
  # HED, lineart, MLSD, scribble, normal. DWPose runs its detector on ONNX Runtime.
  "controlnet-aux>=0.0.7",
  "onnxruntime>=1.17",
  # MiniMax H3's reference node decodes a wired video or audio clip when it builds the reference.
  # The blocks raise a plain ImportError without it, so the node would advertise two ports it
  # cannot read. Video output goes out through ffmpeg, not this.
  "av>=12",
]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  # Bundled ffmpeg for the timeline render and audio waveform peaks (ffprobe is not bundled).
  "imageio-ffmpeg>=0.4",
]
# Multi-GPU denoise via xDiT. Install alongside `runtime`: `.[runtime,parallel]`.
parallel = [
  "xfuser>=0.4",
  "nvidia-ml-py>=12",
]
# LoRA training (the Trainer tab): PEFT adapter training + local auto-caption + host/GPU telemetry.
# Install alongside `runtime`: `.[runtime,training]`. Reuses runtime's torch/diffusers/accelerate.
training = [
  "peft>=0.11",
  # 8-bit Adam keeps optimizer state small; no macOS wheels, so skip it there (AdamW fallback).
  "bitsandbytes>=0.43; platform_system != 'Darwin'",
  "Pillow>=10",
  # Telemetry (CPU/RAM + per-GPU NVML) for the Trainer tab.
  "psutil>=5.9",
  "nvidia-ml-py>=12",
  # Florence-2 auto-captioner is loaded via trust_remote_code and needs these.
  "timm>=1.0",
  "einops>=0.7",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1",
  "httpx>=0.27",
]
# Everything a local install needs in one extra: runtime + server + training (the LoRA trainer),
# so `--install --extra all` is a single "install everything" command. Multi-GPU (xfuser, the
# `parallel` extra) is left out on purpose - it is niche and can fail to build on many systems.
# Lists concrete packages, never `inline-core[...]` self-refs.
all = [
  # runtime
  "torch>=2.2",
  "diffusers==0.39.0",
  "transformers>=4.44",
  "accelerate>=0.30",
  "safetensors>=0.4",
  "torchao>=0.14",
  "scipy>=1.11",
  "huggingface_hub>=0.23",
  "controlnet-aux>=0.0.7",
  "onnxruntime>=1.17",
  # server
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "imageio-ffmpeg>=0.4",
  # training (the Trainer tab)
  "peft>=0.11",
  "bitsandbytes>=0.43; platform_system != 'Darwin'",
  "Pillow>=10",
  "psutil>=5.9",
  "nvidia-ml-py>=12",
  "timm>=1.0",
  "einops>=0.7",
]

# PyPI ships CPU-only torch on Windows; pin the CUDA index there (pip: see requirements.txt).
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]

[project.scripts]
inline-studio = "inline_core.server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inline_core"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored upstream code (see models/minimaxh3/vendor/__init__.py). Editing it to satisfy our
# linters would destroy the one property that makes a re-sync reviewable: it is verbatim.
extend-exclude = ["src/inline_core/models/*/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/models/*/vendor"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so `tests` imports as a package: several suites share fixtures via `from tests.x import y`,
# and without it those modules fail to collect and silently stop running.
pythonpath = ["src", "."]
