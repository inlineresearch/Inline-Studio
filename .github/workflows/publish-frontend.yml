# Build the SPA and publish the prebuilt-frontend wheel (and the engine) to PyPI, so end users
# `pip install inline-core[server,frontend,zimage]` and get the UI with no Node build — mirroring
# ComfyUI's comfyui-frontend-package. See packages/frontend/README.md for the manual equivalent.
#
# Trigger: push a tag like `v1.0.39`, publish a GitHub Release, or run manually (workflow_dispatch
# with an explicit version). The version is derived from the tag (`v1.0.39` -> `1.0.39`) and stamped
# into both pyproject.toml files so the wheels version-track the release.
#
# Auth: PyPI Trusted Publishing (OIDC) — configure a trusted publisher for each project on PyPI
# (project: inline-studio-frontend and inline-core, workflow: publish-frontend.yml). No secrets to
# store. To use an API token instead, drop `permissions.id-token` and pass
# `password: ${{ secrets.PYPI_API_TOKEN }}` to the publish step.
name: Publish to PyPI

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.39). Defaults to the tag.'
        required: false

jobs:
  frontend:
    name: Build SPA + publish inline-studio-frontend
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build the SPA
        run: |
          npm ci
          npm run build:spa   # -> dist-web/

      - name: Stage the build into the wheel payload
        run: |
          rm -rf packages/frontend/inline_studio_frontend/static
          mkdir -p packages/frontend/inline_studio_frontend/static
          cp -r dist-web/* packages/frontend/inline_studio_frontend/static/
          test -f packages/frontend/inline_studio_frontend/static/index.html

      - name: Stamp the package version
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.ver.outputs.version }}\"/" \
            packages/frontend/pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build packages/frontend --outdir dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  engine:
    name: Publish inline-core
    runs-on: ubuntu-latest
    needs: frontend # publish the frontend first so inline-core[frontend] resolves
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp the package version
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.ver.outputs.version }}\"/" core/pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build core --outdir dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
