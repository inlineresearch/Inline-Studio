name: Publish the container image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.2.66). Defaults to the tag.'
        required: false
      latest:
        description: 'Also tag it latest. Turn off when rebuilding an older version.'
        type: boolean
        default: true

env:
  IMAGE: inlineresearch/inline-studio

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Prepare
        id: prep
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ "${{ github.event_name }}" = "release" ]; then
            LATEST="${{ !github.event.release.prerelease }}"
          else
            LATEST="${{ github.event.inputs.latest }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          sed -i "s/^version = .*/version = \"$VERSION\"/" core/pyproject.toml
          echo "building $VERSION, latest=$LATEST"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.prep.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/inlineresearch/Inline-Studio
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=min

      - name: Smoke test, then move latest
        env:
          TAG: ${{ steps.prep.outputs.version }}
        run: |
          docker run -d --name smoke -p 8848:8848 \
            -e INLINE_PROFILE=cpu -e ENABLE_JUPYTER=0 -e ENABLE_FILEBROWSER=0 \
            "${IMAGE}:${TAG}"
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8848/v1/health >/dev/null && break || sleep 2
          done
          curl -fsS http://127.0.0.1:8848/v1/health
          curl -fsS http://127.0.0.1:8848/ | grep -q 'id="root"' || { docker logs smoke; exit 1; }
          docker rm -f smoke
          if [ "${{ steps.prep.outputs.latest }}" = "true" ]; then
            docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:${TAG}"
          fi
